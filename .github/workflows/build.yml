name: Build and test FreshGenerator
# One gate for the repository: compile the mod, generate the worldgen pack and run
# every Java test (cave, climate, relief, forest, terrain, village contracts).
# Native world-generation audits run locally against isolated servers; see docs/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2'}
      - name: Pinned dependency fallback
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp scripts/central-fallback.init.gradle "$HOME/.gradle/init.d/freshgenerator-central-fallback.init.gradle"
      - name: Build and run all tests
        run: gradle --no-daemon --console=plain build
      - name: Upload the mod JAR (sources and dev outputs excluded)
        uses: actions/upload-artifact@v4
        with:
          name: FreshGenerator-mod
          path: |
            build/libs/FreshGenerator-Fabric-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
